[package]
name = "rust-irrd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[[bin]]
name = "rpsl"
path = "fuzz_targets/rpsl.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "nrtm3"
path = "fuzz_targets/nrtm3.rs"
test = false
doc = false
bench = false

[dependencies.anyhow]
version = "=1.0.104"

[dependencies.serde]
version = "=1.0.229"
features = ["derive"]

[dependencies.serde_json]
version = "=1.0.154"

[[bin]]
name = "rpki"
path = "fuzz_targets/rpki.rs"
test = false
doc = false
bench = false
