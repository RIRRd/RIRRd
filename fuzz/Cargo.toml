[package]
name = "rust-irrd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[[bin]]
name = "rpsl"
path = "fuzz_targets/rpsl.rs"
