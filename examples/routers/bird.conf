# Synthetic, disabled peer. Adapt addresses, ASNs and export policy on your router.
router id 192.0.2.1;
include "/etc/bird/rirrd/filters.bird";
filter docs_irr_in4 {
    if net ~ DOCS_IRR_4 then accept;
    reject;
}
filter docs_irr_in6 {
    if net ~ DOCS_IRR_6 then accept;
    reject;
}
protocol bgp docs_peer {
    disabled;
    local as 64497;
    neighbor 192.0.2.2 as 64496;
    ipv4 { import filter docs_irr_in4; export none; };
    ipv6 { import filter docs_irr_in6; export none; };
}
