! Synthetic, administratively disabled peer. Prepend the generated filters.frr.
frr defaults traditional
hostname rirrd-docs
route-map DOCS-IN4 permit 10
 match ip address prefix-list DOCS_IRR_4
route-map DOCS-IN6 permit 10
 match ipv6 address prefix-list DOCS_IRR_6
router bgp 64497
 bgp router-id 192.0.2.1
 no bgp default ipv4-unicast
 neighbor 192.0.2.2 remote-as 64496
 neighbor 192.0.2.2 shutdown
 address-family ipv4 unicast
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 route-map DOCS-IN4 in
 exit-address-family
 address-family ipv6 unicast
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 route-map DOCS-IN6 in
 exit-address-family
