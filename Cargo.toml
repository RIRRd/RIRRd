[package]
name = "rust-irrd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-graphql = { version = "=7.2.1", default-features = false, features = ["dynamic-schema"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
bcrypt = { version = "=0.19.3", default-features = false, features = ["std", "zeroize"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
md-5 = "0.11"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }
redb = "=2.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = "1"
