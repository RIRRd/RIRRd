services:
  postgres:
    image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
    environment:
      POSTGRES_DB: irrd
      POSTGRES_USER: irrd
      POSTGRES_PASSWORD: oracle-fixture-only
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "irrd", "-d", "irrd"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8.2.3-bookworm@sha256:0908d9af26bf9b985e984a40a5eb82eed229b07a3317eee6843832c3cc3a9619
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  reference:
    build:
      context: .
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${IRRD_ORACLE_PORT:-8043}:8043"
      - "127.0.0.1:${IRRD_ORACLE_HTTP_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ../../docs/compatibility/differential-whois.rpsl
        target: /fixture/differential-whois.rpsl
        read_only: true
        bind:
          create_host_path: false
    command:
      - /bin/sh
      - -ec
      - |
        irrd_database_upgrade --config /etc/irrd.yaml
        irrd_load_database --config /etc/irrd.yaml --source DIFFERENTIAL /fixture/differential-whois.rpsl
        exec irrd --config /etc/irrd.yaml --foreground
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import socket
          with socket.create_connection(("127.0.0.1", 8043), timeout=2) as conn:
              conn.sendall(b"!maut-num,AS64496\r\n")
              with conn.makefile("rb") as response:
                  assert response.readline(32).startswith(b"A")
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
