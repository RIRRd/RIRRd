name: Deployment smoke test

on:
  workflow_dispatch:
    inputs:
      public_readonly:
        description: Verify the deployed UK websites and read-only IRR endpoints from this runner
        type: boolean
        default: false
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-readonly:
    if: github.event_name == 'workflow_dispatch' && inputs.public_readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public IPv4 HTTPS, content, redirects and retired endpoints
        shell: bash
        run: |
          set -euo pipefail
          for host in rirrd.co.uk irrd.tools; do
            getent ahostsv4 "$host"
            curl -4 --fail --silent --show-error --max-time 20 "https://$host/" > "$RUNNER_TEMP/$host.html"
            grep -qi 'RIRRd' "$RUNNER_TEMP/$host.html"
            test "$(curl -4 --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code} %{redirect_url}' "http://$host/")" = "308 https://$host/"
            for path in /v1/rpki/status /v1/rpki/validate; do
              test "$(curl -4 --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "https://$host$path")" = 404
            done
            echo "Verified IPv4 HTTPS certificate/content, HTTP redirect and retired endpoints: $host"
          done
          curl -4 --fail --silent --show-error --max-time 20 https://irrd.tools/dashboard/live.json > "$RUNNER_TEMP/node.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          node=json.loads((Path(os.environ['RUNNER_TEMP'])/'node.json').read_text())
          assert node['service']=='online' and node['total_objects']>0
          print('External node observation:',node['total_objects'],'objects;',len(node['sources']),'sources')
          PY
          curl -4 --fail --silent --show-error --max-time 20 --get --data-urlencode 'sources=RIPE' --data-urlencode 'q=!gAS3333' https://irrd.tools/v1/whois/ | grep -F '193.0.0.0/21'
      - name: Verify IPv6 when the runner has a usable route
        if: always()
        shell: bash
        run: |
          if ip -6 route get 2a0f:6280:1d:1940:e6d8:d666:4268:d4c8 >/dev/null 2>&1; then
            curl -6 --fail --silent --show-error --max-time 20 https://rirrd.co.uk/ > /dev/null
            curl -6 --fail --silent --show-error --max-time 20 https://irrd.tools/ > /dev/null
            echo 'External IPv6 HTTPS passed.'
          else
            echo 'IPv6 unavailable at this external runner; this is not a passed IPv6 check.'
          fi
  compose:
    if: github.event_name != 'workflow_dispatch' || !inputs.public_readonly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and import a snapshot
        run: |
          docker compose -p rust-irrd-smoke -f deploy/compose.yaml config --quiet
          docker compose -p rust-irrd-smoke -f deploy/compose.yaml build
          docker compose -p rust-irrd-smoke -f deploy/compose.yaml run --rm --no-deps \
            --volume "$PWD/examples/example.rpsl:/snapshot.rpsl:ro" \
            irrd import snapshot --source EXAMPLE --file /snapshot.rpsl
      - name: Test a live query and verify after shutdown
        run: |
          docker compose -p rust-irrd-smoke -f deploy/compose.yaml up -d --wait --wait-timeout 90
          python3 - <<'PY'
          from socket import create_connection

          with create_connection(("127.0.0.1", 4343), timeout=5) as socket:
              socket.sendall(b"!mroute,192.0.2.0/24AS64496\n")
              with socket.makefile("rb") as reply:
                  header = reply.readline(32)
                  assert header.startswith(b"A"), header
                  body = reply.read(int(header[1:]))
                  assert b"192.0.2.0/24" in body
                  assert reply.read(3) == b"C\n"
          PY
          docker compose -p rust-irrd-smoke -f deploy/compose.yaml stop
          docker compose -p rust-irrd-smoke -f deploy/compose.yaml run --rm --no-deps irrd database verify
      - name: Print daemon logs on failure
        if: failure()
        run: docker compose -p rust-irrd-smoke -f deploy/compose.yaml logs --no-color
      - name: Remove isolated test data
        if: always()
        run: docker compose -p rust-irrd-smoke -f deploy/compose.yaml down --volumes
