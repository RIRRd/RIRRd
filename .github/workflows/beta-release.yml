name: Beta release
on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-suite:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.')
    uses: ./.github/workflows/ci.yml
  oracle:
    needs: build-suite
    uses: ./.github/workflows/upstream-oracle.yml
  routers:
    needs: build-suite
    uses: ./.github/workflows/router-dashboard.yml
  deployment:
    needs: build-suite
    uses: ./.github/workflows/deployment-smoke.yml
  fuzz:
    needs: build-suite
    uses: ./.github/workflows/fuzz.yml
  verify:
    needs: [build-suite, oracle, routers, deployment, fuzz]
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require the reviewed main history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: python3 tools/check_public_tree.py
      - name: Scan the complete reachable source history
        run: |
          image=docker.io/zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker run --rm --network none --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --entrypoint /bin/sh "$image" -c 'git config --global --add safe.directory /repo; exec gitleaks git /repo --log-opts=--all --redact --config /repo/.gitleaks.toml'
      - name: Verify tag matches package beta version
        run: |
          python3 - <<'PY'
          import os,tomllib
          with open('Cargo.toml','rb') as f: version=tomllib.load(f)['package']['version']
          assert os.environ['GITHUB_REF_NAME']=='v'+version
          assert '-beta.' in version
          PY
  packages:
    needs: verify
    uses: ./.github/workflows/native-packages.yml
  publish:
    needs: [verify, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download verified native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'native-linux-*' --dir dist
          find dist -name '*.deb' -o -name '*.rpm' | sort > "$RUNNER_TEMP/archives"
          test "$(wc -l < "$RUNNER_TEMP/archives")" = 4
          mkdir release-assets
          while IFS= read -r archive; do
            name=$(basename "$archive")
            name=${name//\~/.}
            cp "$archive" "release-assets/$name"
          done < "$RUNNER_TEMP/archives"
          cp tools/install.sh release-assets/install.sh
          cd release-assets
          sha256sum ./*.deb ./*.rpm ./install.sh > SHA256SUMS
      - name: Publish an explicit prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --title "RIRRd $TAG — beta" \
            --notes-file "docs/releases/$TAG.md"
      - name: Verify published names and server-side SHA-256 digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/published-assets.json"
          python3 tools/release/check-assets.py release-assets/SHA256SUMS "$RUNNER_TEMP/published-assets.json"
