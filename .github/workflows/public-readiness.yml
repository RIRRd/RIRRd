name: Source publication hygiene
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check candidate tree and reachable historical files
        run: python3 tools/check_public_tree.py --snapshot "$RUNNER_TEMP/public-tree"
      - name: Scan history and candidate tree with pinned Gitleaks 8.30.1
        run: |
          # Official image; network is disabled while repository contents are mounted.
          image=docker.io/zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker pull "$image"
          docker run --rm --network none --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --entrypoint /bin/sh "$image" -c 'git config --global --add safe.directory /repo; exec gitleaks git /repo --log-opts=--all --redact --config /repo/.gitleaks.toml'
          docker run --rm --network none --mount "type=bind,source=$RUNNER_TEMP/public-tree,target=/tree,readonly" \
            "$image" dir /tree --redact --config /tree/.gitleaks.toml
          # New secrets in the files with exact fixture exceptions must still fail.
          mkdir -p "$RUNNER_TEMP/secret-canary/src" "$RUNNER_TEMP/secret-canary/tests" "$RUNNER_TEMP/secret-canary/tools/oracle" "$RUNNER_TEMP/secret-canary-report"
          python3 - "$RUNNER_TEMP/secret-canary/src/rpsl.rs" "$RUNNER_TEMP/secret-canary/tests/smoke.rs" "$RUNNER_TEMP/secret-canary/tools/oracle/query_scope_fixture.py" <<'PYTHON'
          import base64, os, sys
          from pathlib import Path
          label = "PGP " + "PRIVATE KEY BLOCK"
          body = base64.b64encode(os.urandom(48)).decode()
          Path(sys.argv[1]).write_text("-----BEGIN " + label + "-----\n" + body + "\n-----END " + label + "-----\n")
          Path(sys.argv[2]).write_text('const API_KEY = "' + os.urandom(32).hex() + '";\n')
          Path(sys.argv[3]).write_text('API_KEY = "' + os.urandom(32).hex() + '"\n')
          PYTHON
          set +e
          docker run --rm --network none --mount "type=bind,source=$RUNNER_TEMP/secret-canary,target=/canary,readonly" \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/secret-canary-report,target=/out" \
            "$image" dir /canary --redact --config /repo/.gitleaks.toml --report-format json --report-path /out/result.json
          scan_status=$?
          set -e
          test "$scan_status" -eq 1
          python3 - "$RUNNER_TEMP/secret-canary-report/result.json" <<'PYTHON'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          assert any(row["RuleID"] == "private-key" and row["File"].endswith("src/rpsl.rs") for row in rows)
          assert any(row["RuleID"] == "generic-api-key" and row["File"].endswith("tests/smoke.rs") for row in rows)
          assert any(row["RuleID"] == "generic-api-key" and row["File"].endswith("tools/oracle/query_scope_fixture.py") for row in rows)
          PYTHON
