name: Feature request
description: Explain an operator workflow or missing capability.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the operator problem and how you handle it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include relevant upstream behavior, resource constraints or router workflows.
