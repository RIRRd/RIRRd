title = "RIRRd secret scanning — default rules with narrow public-data exceptions"
[extend]
useDefault = true

[allowlist]
description = "Public binary SHA-256 metadata and one unsupported public-PGP-ID fixture, never deployment credentials"
regexTarget = "line"
regexes = [
  '''^\s*"load_client_sha256":\s*"[a-f0-9]{64}",?\s*$''',
  '''^\s*"(?:auth: )?PGPKEY-[0-9A-Fa-f]{8}"\.to_owned\(\),\s*$'''
]
